# Only successful content-hashed build assets are immutable. HTML, public files
# and errors must revalidate so a deployment/rollback never pins an old shell.
map "$status:$uri" $watchalert_static_cache {
    default "no-cache";
    "~^(200|206|304):/assets/.+-[A-Za-z0-9_-]{8,}\.(js|mjs|css|woff2?|ttf|otf|svg|png|jpe?g|gif|webp|avif|ico|wasm)$" "public, max-age=31536000, immutable";
}

server {
    listen 80;

    root /app;
    index index.html index.htm;

    # Compress public static content only, including requests via an Ingress.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/wasm;

    add_header Cache-Control $watchalert_static_cache always;
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
    add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';

    # A missing JS/worker must be a 404, not index.html with a JavaScript URL.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        # Do not compress or apply the static cache policy to authenticated API/SSE.
        # These local add_header directives intentionally replace server headers.
        gzip off;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';

        # 优化超时设置，避免因请求处理时间过长导致超时
        proxy_connect_timeout 300;
        proxy_read_timeout 300;
        proxy_send_timeout 300;

        # 优化缓冲区设置，避免大请求体导致缓冲区不足
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # 关闭代理请求缓冲，确保大请求体直接传递到后端
        proxy_request_buffering off;
        # Required for chunked request streaming on older stable Nginx versions.
        proxy_http_version 1.1;

        # Copilot 的 POST + SSE 响应必须立即透传，不能由 Nginx 聚合后再返回。
        proxy_buffering off;
        proxy_cache off;

        # 配置SSL和代理相关参数
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2;
        proxy_pass http://w8t-service:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward the original body; $request_body can be empty for streamed or
        # file-backed requests and must not be used to reconstruct the payload.
        proxy_pass_request_headers on;
    }

    # 错误页面配置
    error_page 500 502 503 504 /500.html;

    # 全局请求体大小限制
    client_max_body_size 2050m;
    client_body_buffer_size 1024k;

    # 保持连接超时时间
    keepalive_timeout 10;
}
