name: Frontend checks
on:
  push:
    branches: [eddie, 'codex/**']
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit
      - run: npm test
      - run: npm run build
      - name: Install Nginx for isolated delivery checks
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nginx
      - run: npm run test:nginx
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
